<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Edit Order' : 'Add Order' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Customer</mat-label>
        <mat-select formControlName="customerId" required [disabled]="isEditMode">
          <mat-option *ngFor="let customer of customers" [value]="customer.id">
            {{ customer.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="orderForm.get('customerId')?.hasError('required')">
          Customer is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Order Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="orderDate" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="orderForm.get('orderDate')?.hasError('required')">
          Order date is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Total Amount</mat-label>
        <input matInput type="number" formControlName="totalAmount" required min="0" step="0.01">
        <mat-error *ngIf="orderForm.get('totalAmount')?.hasError('required')">
          Total amount is required
        </mat-error>
        <mat-error *ngIf="orderForm.get('totalAmount')?.hasError('min')">
          Total amount must be positive
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status" required>
          <mat-option *ngFor="let status of statuses" [value]="status">
            {{ status }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="orderForm.get('status')?.hasError('required')">
          Status is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Notes</mat-label>
        <textarea matInput formControlName="notes" rows="3"></textarea>
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="!orderForm.valid">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
